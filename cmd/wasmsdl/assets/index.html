<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The canvas receives its CSS size from the Go side at window creation
         (sdl.CreateWindow / CreateWindowAndRenderer). SDL's web backend uses the
         canvas CSS layout size as the window size, so it must not collapse to 0. */
      #canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script type="text/javascript">
      // As a default initial behavior, pop up an alert when the webgl context is
      // lost. Override this before shipping a real application.
      var canvasElement = document.getElementById('canvas');
      canvasElement.addEventListener('webglcontextlost', (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);
      var Module = {
        print(...args) { console.log(...args); },
        printErr(...args) { console.error(...args); },
        canvas: canvasElement,
      };
    </script>
    <script type="text/javascript" src="sdl.js"></script>
    <script type="text/javascript" src="wasm_exec.js"></script>
    <script>
      // Polyfill
      if (!WebAssembly.instantiateStreaming) {
        WebAssembly.instantiateStreaming = async (resp, importObject) => {
          const source = await (await resp).arrayBuffer();
          return await WebAssembly.instantiate(source, importObject);
        };
      }
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
        go.run(result.instance);
      });
    </script>
  </body>
</html>
