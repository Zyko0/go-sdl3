name: Build - Test

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches:
            - main

jobs:
  test:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.x']
    
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
        - name: Checkout
          uses: actions/checkout@v5
        - name: Setup Go
          uses: actions/setup-go@v6
          with:
            go-version: ${{ matrix.go }}
        
        - name: go build
          run: |
            go build ./...
            env GOOS=js GOARCH=wasm go build ./...
            # Examples
            go build -o gpu ./examples/gpu/examples
            go build ./examples/helloworld
            go build ./examples/renderer/09-scaling-textures

            # WebAssembly: the whole module is built above; build the browser
            # examples explicitly so a break is attributed to a named example.
            env GOOS=js GOARCH=wasm go build ./examples/helloworld
            env GOOS=js GOARCH=wasm go build ./examples/wasmcheck
            env GOOS=js GOARCH=wasm go build ./examples/imgttf
            env GOOS=js GOARCH=wasm go build ./examples/audio
        
        - name: go test
          run : |
            go test -v ./...